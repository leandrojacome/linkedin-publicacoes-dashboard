services:
  publicacoes:
    image: ${PUBLICACOES_IMAGE:-ghcr.io/leandrojacome/linkedin-publicacoes-dashboard:latest}
    networks:
      - edge_services
    environment:
      PUBLIC_MODE: "false"
      PUBLIC_ORIGIN: https://publicacoes.leandro.inf.br
      PUBLICACOES_ADMIN_USER: leandro
      PUBLICACOES_ADMIN_PASSWORD_HASH_FILE: /run/secrets/publicacoes_admin_password_hash
      PUBLICACOES_SESSION_SECRET_FILE: /run/secrets/publicacoes_session_secret
    secrets:
      - publicacoes_admin_password_hash
      - publicacoes_session_secret
    volumes:
      - publicacoes_data:/app/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.publicacoes-leandro.rule=Host(`publicacoes.leandro.inf.br`)
        - traefik.http.routers.publicacoes-leandro.entrypoints=websecure
        - traefik.http.routers.publicacoes-leandro.tls.certresolver=letsencrypt
        - traefik.http.services.publicacoes-leandro.loadbalancer.server.port=5682

networks:
  edge_services:
    external: true

secrets:
  publicacoes_admin_password_hash:
    external: true
  publicacoes_session_secret:
    external: true

volumes:
  publicacoes_data:
